# ============================================
# 얼불춤 자동 매크로 설정 파일
# A Dance of Fire and Ice - Auto Macro Config
# ============================================

# 매크로 설정
macro:
  # 입력할 키. 쉼표로 여러 개 지정하면 타일마다 번갈아 눌러 같은 키 연타를
  # 피한다 (게임의 채터 블로커 회피). 예: w,f,o,j / space / d,f,j,k
  key: q,w,e,r,t,y,u,i,o,p

  # 시작 카운트다운 (초)
  countdown: 3

  # 시작 딜레이 (ms) - 게임 로딩 시간에 맞춰 조정
  start_delay: 0

# 핫키 설정
hotkeys:
  # 매크로 시작/중지 토글
  toggle: f6

  # 프로그램 종료
  quit: f8

# 오버레이 설정
overlay:
  # 상태 오버레이 표시 여부
  enabled: true
